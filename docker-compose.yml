services:
  postgres:
    image: postgres:15-alpine
    container_name: medilink-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-medilink}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-medilink}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: medilink-backend
    restart: always
    ports:
      - "5001:5000"
    environment:
      NODE_ENV: development
      PORT: 5000
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-medilink}?schema=public
      JWT_SECRET: ${JWT_SECRET:-medilink_super_secret_jwt_key_2024}
      JWT_EXPIRE: 30d
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-openai/gpt-4o-mini}
      OPENROUTER_URL: ${OPENROUTER_URL:-https://openrouter.ai/api/v1/chat/completions}
      AI_TIMEOUT_MS: ${AI_TIMEOUT_MS:-10000}
    depends_on:
      postgres:
        condition: service_healthy
    command: sh -c "npx prisma migrate deploy && npm start"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: medilink-frontend
    restart: always
    ports:
      - "3001:3000"
    environment:
      VITE_API_TARGET: http://backend:5000
    depends_on:
      - backend

  mongo:
    image: mongo:6-alpine
    container_name: medilink-mongo-optional
    restart: "no"
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    profiles:
      - mongo

  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: medilink-migrate
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-medilink}?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    command: npx prisma migrate deploy
    profiles:
      - tools

  seed:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: medilink-seed
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-medilink}?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    command: sh -c "npx prisma migrate deploy && npm run seed"
    profiles:
      - tools

  prisma-studio:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: medilink-prisma-studio
    ports:
      - "5555:5555"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-medilink}?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    command: sh -c "npx prisma migrate deploy && npx prisma studio --port 5555 --browser none"
    profiles:
      - tools

volumes:
  postgres_data:
  mongo_data:
